<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="./src/js/login.js" type="module" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar al sitio</title>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100 bg-light">
            <div class="col-6">
                <div class="card p-4">
                    <h2 class="h2 mb-4 text-center">Municipalidad IT</h2>
                    <form id="formulario-login">
                        <div class="mb-3">
                            <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Usuario"
                                autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Contraseña" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary mt-2 w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

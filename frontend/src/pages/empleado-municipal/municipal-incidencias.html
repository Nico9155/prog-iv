<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="municipal-incidencias.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <title>Mis Incidencias</title>
</head>

<body>
  <main>
    <div class="container-fluid">
      <div class="row min-vh-100">
        <div class="col-12 col-md-3 menu-lateral text-center text-md-start municipal-nav-bg">
          <div class="d-flex flex-column flex-shrink-0 p-3 min-vh-100">
            <a href="#" class="d-flex mb-1 mb-md-0 me-md-auto text-decoration-none">
              <span class="fs-4 fw-bold text-white">
                <p>MUNI-IT</p>
              </span>
            </a>
            <p class="fs-6 pb-3 mb-0 text-light">Gobierno Municipal de la Ciudad</p>
            <p class="fs-6 py-1 mb-0 text-light">NAVEGACIÓN</p>
            <ul class="nav nav-pills flex-column mb-auto">
              <li class="nav-item">
                <a href="#" class="nav-link current text-white nav-btn-bg" aria-current="page">
                  Mis incidencias
                </a>
              </li>
              <li>
                <a href="./municipal-articulos.html" class="nav-link link-dark text-secondary">
                  Artículos
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="col-12 col-md-9 content-bg">
          <div class="row bg-white">
            <div class="col-12 col-md-9">
              <h1 class="fs-3 fs-md-1 p-3">Mis incidencias</h1>
            </div>
            <div class="col-12 col-md-3 dropdown">
              <div class="p-1">
                <a href="#" class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle"
                  id="dropdownUser2" data-bs-toggle="dropdown" aria-expanded="false">
                  <span id="navbar-nombre-usuario" class="fs-6 fw-semibold"></span>
                </a>
                <p id="navbar-rol-usuario" class="small text-muted mb-0"></p>
                <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser2">
                  <li><a class="dropdown-item" href="#" id="btn-cerrar-sesion">Cerrar sesión</a></li>
                </ul>
              </div>
            </div>
          </div>
          <div class="d-flex py-2 flex-row-reverse">
            <button type="button" class="btn btn-primary align-items-center" data-bs-toggle="modal"
              data-bs-target="#modalNuevaIncidencia"> Crear nueva incidencia </button>
          </div>
          <div class="bg-white px-4 py-1 rounded-3">
            <div class="row table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Número</th>
                    <th scope="col">Creada el</th>
                    <th scope="col">Artículo</th>
                    <th scope="col">Detalle del pedido</th>
                    <th scope="col">Prioridad</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tabla-incidencias">

                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalNuevaIncidencia" tabindex="-1" aria-labelledby="modalNuevaIncidenciaLabel">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">

        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title fw-bold fs-5" id="modalNuevaIncidenciaLabel">Registrar Nueva Incidencia</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form id="formNuevaIncidencia">

            <div class="mb-3">
              <label for="incidencia-articulo-id" class="form-label fw-semibold text-secondary small">Artículo afectado</label>
              <select id="incidencia-articulo-id" class="form-select" required>
                <option value="" disabled selected>Selecciona un artículo</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="incidencia-detalle" class="form-label fw-semibold text-secondary">Detalle del problema</label>
              <textarea id="incidencia-detalle" class="form-control" rows="4"
                placeholder="Describe detalladamente la falla detectada..." required></textarea>
            </div>

            <div class="mb-3">
              <label for="incidencia-prioridad" class="form-label fw-semibold text-secondary small">Prioridad</label>
              <select id="incidencia-prioridad" class="form-select" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="1">1 - Baja</option>
                <option value="2">2 - Media</option>
                <option value="3">3 - Alta</option>
              </select>
            </div>

          </form>
        </div>

        <div class="modal-footer bg-light border-0">
          <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="formNuevaIncidencia" class="btn btn-primary fw-bold px-4">Guardar
            Incidencia</button>
        </div>

      </div>
    </div>
  </div>

</body>

</html>

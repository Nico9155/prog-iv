<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="director-incidencias.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <title>Panel de Incidencias - Director</title>
</head>

<body>
    <main>
        <div class="container-fluid">
            <div class="row min-vh-100">
                <div class="col-12 col-md-3 menu-lateral text-center text-md-start director-nav-bg">
                    <div class="d-flex flex-column flex-shrink-0 p-3 min-vh-100">
                        <a href="#" class="d-flex mb-1 mb-md-0 me-md-auto text-decoration-none">
                            <span class="fs-4 fw-bold text-white">
                                <p>MUNI-IT</p>
                            </span>
                        </a>
                        <p class="fs-6 pb-3 mb-0 text-light">Gobierno Municipal de la Ciudad</p>
                        <p class="fs-6 py-1 mb-0 text-light">NAVEGACIÓN</p>
                        <ul class="nav nav-pills flex-column mb-auto">
                            <li class="nav-item">
                                <a href="./director-dashboard.html" class="nav-link link-dark text-secondary" aria-current="page">
                                    <p class="fs-6 mb-0">Dashboard</p>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="nav-link current text-white nav-btn-bg">
                                    <p class="fs-6 mb-0 off-light">Incidencias</p>
                                </a>
                            </li>
                            <li>
                                <a href="./director-reportes.html" class="nav-link link-dark text-secondary">
                                    <p class="fs-6 mb-0 off-light">Reportes</p>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-12 col-md-9 content-bg">
                    <div class="row mb-2 bg-white">
                        <div class="col-12 col-md-9">
                            <h1 class="fs-3 fs-md-1 p-3">Panel de incidencias</h1>
                        </div>
                        <div class="col-12 col-md-3 dropdown">
                            <div class="p-1">
                                <a href="#"
                                    class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle"
                                    id="dropdownUser2" data-bs-toggle="dropdown" aria-expanded="false">
                                    <span id="navbar-nombre-usuario" class="fs-6 fw-semibold"></span>
                                </a>
                                <p id="navbar-rol-usuario" class="small text-muted mb-0"></p>
                                <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser2">
                                    <li><a class="dropdown-item" href="#" id="btn-cerrar-sesion">Cerrar sesión</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white px-4 py-1 rounded-3">
                        <div class="row table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th scope="col">Número</th>
                                        <th scope="col">Creada el</th>
                                        <th scope="col">Artículo</th>
                                        <th scope="col">Detalle</th>
                                        <th scope="col">Asignado a</th>
                                        <th scope="col">Prioridad</th>
                                        <th scope="col">Estado</th>
                                        <th scope="col" class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-incidencias">

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Asignar Incidencia -->
    <div class="modal fade" id="modalAsignarIncidencia" tabindex="-1" aria-labelledby="modalAsignarIncidenciaLabel">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold fs-5" id="modalAsignarIncidenciaLabel">Asignar Incidencia a Sistemas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formAsignarIncidencia">
                        <input type="hidden" id="asignar-incidencia-id">
                        <div class="mb-3">
                            <label for="select-empleado-sistemas" class="form-label fw-semibold text-secondary">Seleccione el empleado del área de Sistemas</label>
                            <select id="select-empleado-sistemas" class="form-select" required>
                                <option value="" disabled selected>Seleccione un técnico...</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formAsignarIncidencia" class="btn btn-primary fw-bold px-4">Confirmar Asignación</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
